<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organigramme Neoteem</title>
    <style>
      :root {
        /* Marque */
        --navy: #013677;
        --teal: #00a998;

        /* Neutres */
        --ink: #0f1b2d;
        --ink-2: #56616f;
        --ink-3: #8b95a2;
        --line: #e5e8ec;
        --line-2: #d4d9e0;
        --surface: #ffffff;
        --canvas: #f6f7f9;
        --tint: #f2f6fa;

        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 1px 2px rgba(15, 27, 45, 0.04);
        --shadow-lift: 0 6px 18px rgba(15, 27, 45, 0.08);

        --font:
          "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      /* ---------------------------------------------------------------
         Barre superieure
      --------------------------------------------------------------- */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 28px;
        height: 64px;
      }

      .brand {
        display: flex;
        align-items: center;
      }

      .brand img {
        height: 30px;
        width: auto;
        display: block;
      }

      .topbar h1 {
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        padding-left: 20px;
        border-left: 1px solid var(--line);
        color: var(--ink);
      }

      .topbar .spacer {
        flex: 1;
      }

      .search {
        position: relative;
        display: flex;
        align-items: center;
      }

      .search input {
        font-family: inherit;
        font-size: 0.85rem;
        color: var(--ink);
        background: var(--canvas);
        border: 1px solid var(--line);
        border-radius: 50px;
        padding: 8px 16px 8px 36px;
        width: 260px;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          width 0.15s ease;
      }

      .search input::placeholder {
        color: var(--ink-3);
      }

      .search input:focus {
        outline: none;
        background: var(--surface);
        border-color: var(--navy);
        width: 300px;
      }

      .search svg {
        position: absolute;
        left: 13px;
        width: 14px;
        height: 14px;
        stroke: var(--ink-3);
        fill: none;
        stroke-width: 2;
        pointer-events: none;
      }

      .admin-link {
        font-size: 0.8rem;
        color: var(--ink-3);
        text-decoration: none;
        padding: 6px 0;
        border-bottom: 1px solid transparent;
        transition: color 0.15s ease;
      }

      .admin-link:hover {
        color: var(--navy);
        border-bottom-color: var(--line-2);
      }

      /* ---------------------------------------------------------------
         Onglets
      --------------------------------------------------------------- */
      .tabs {
        position: sticky;
        top: 64px;
        z-index: 19;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 4px;
        padding: 0 28px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .tabs::-webkit-scrollbar {
        display: none;
      }

      .tabs button {
        position: relative;
        border: none;
        background: none;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--ink-2);
        padding: 14px 14px 13px 14px;
        cursor: pointer;
        white-space: nowrap;
        border-bottom: 2px solid transparent;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }

      .tabs button:hover {
        color: var(--ink);
      }

      .tabs button.active {
        color: var(--navy);
        font-weight: 600;
        border-bottom-color: var(--navy);
      }

      /* ---------------------------------------------------------------
         Contenu
      --------------------------------------------------------------- */
      main {
        max-width: 1360px;
        margin: 0 auto;
        padding: 28px 28px 80px 28px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .eyebrow {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--teal);
      }

      /* Tete d'onglet */
      .team-head {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 22px 26px;
        display: flex;
        align-items: center;
        gap: 22px;
      }

      .team-head .portrait {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--tint);
        box-shadow: 0 0 0 1px var(--line-2);
        flex: none;
      }

      .team-head h2 {
        font-size: 1.3rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin-top: 3px;
      }

      .team-head .role {
        font-size: 0.88rem;
        color: var(--ink-2);
      }

      .team-head .count {
        margin-left: auto;
        text-align: right;
        font-size: 0.78rem;
        color: var(--ink-3);
        line-height: 1.3;
      }

      .team-head .count strong {
        display: block;
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--ink);
      }

      /* Bloc */
      .block {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px 26px 24px 26px;
      }

      .block-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding-bottom: 14px;
        margin-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }

      .block-head h3 {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--ink);
      }

      .block-head .tally {
        font-size: 0.72rem;
        color: var(--ink-3);
        font-variant-numeric: tabular-nums;
      }

      /* Sous-ligne */
      .subline + .subline {
        border-top: 1px solid var(--line);
      }

      .subline-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--ink-2);
        padding: 18px 0 2px 0;
      }

      .subline-label::before {
        content: "";
        width: 14px;
        height: 2px;
        background: var(--teal);
        flex: none;
      }

      /* Grille de cartes */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
        gap: 4px;
        padding: 12px 0 0 0;
      }

      .cards.centered {
        grid-template-columns: repeat(auto-fit, minmax(210px, 240px));
        justify-content: center;
        gap: 12px;
        padding-top: 18px;
      }

      /* Carte */
      .person {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 2px;
        padding: 16px 10px 14px 10px;
        border: 1px solid transparent;
        border-radius: var(--radius-sm);
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .person:hover {
        background: var(--surface);
        border-color: var(--line);
        transform: translateY(-2px);
        box-shadow: var(--shadow-lift);
      }

      .person img {
        width: 74px;
        height: 74px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--tint);
        box-shadow: 0 0 0 1px var(--line-2);
        margin-bottom: 10px;
      }

      .person .name {
        font-size: 0.84rem;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.005em;
      }

      .person .role {
        font-size: 0.74rem;
        color: var(--ink-3);
        line-height: 1.35;
      }

      /* Responsable : anneau teal, pas de pave de couleur */
      .person.is-manager img {
        box-shadow:
          0 0 0 2px var(--teal),
          0 0 0 4px var(--surface);
      }

      .person.is-manager .role {
        color: var(--teal);
        font-weight: 600;
      }

      /* Direction : carte plus large, anneau navy */
      .person.is-founder {
        padding: 26px 18px 22px 18px;
        border-color: var(--line);
        background: var(--surface);
      }

      .person.is-founder img {
        width: 124px;
        height: 124px;
        margin-bottom: 16px;
        box-shadow:
          0 0 0 2px var(--navy),
          0 0 0 4px var(--surface);
      }

      .person.is-founder .name {
        font-size: 1rem;
      }

      .person.is-founder .role {
        font-size: 0.8rem;
        color: var(--ink-2);
      }

      /* ---------------------------------------------------------------
         Etats
      --------------------------------------------------------------- */
      .state {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 40px 30px;
        text-align: center;
      }

      .state h2 {
        font-size: 0.95rem;
        font-weight: 600;
      }

      .state p {
        margin-top: 6px;
        font-size: 0.85rem;
        color: var(--ink-3);
      }

      .state.error {
        border-left: 3px solid #c0392b;
        text-align: left;
      }

      .state.error h2 {
        color: #c0392b;
      }

      .hidden {
        display: none !important;
      }

      /* Pendant une recherche, les compteurs de section ne veulent plus rien dire */
      main.filtering .tally {
        display: none;
      }

      @media (max-width: 720px) {
        .topbar {
          height: auto;
          padding: 12px 18px;
          flex-wrap: wrap;
          gap: 12px;
        }

        .topbar h1 {
          padding-left: 0;
          border-left: none;
        }

        .tabs {
          position: static;
          padding: 0 18px;
        }

        /* Le titre et le lien admin restent sur la premiere ligne,
           la recherche prend toute la seconde */
        .topbar .spacer {
          display: none;
        }

        .admin-link {
          order: 2;
          margin-left: auto;
        }

        .search {
          order: 3;
          flex: 1 0 100%;
        }

        .search input,
        .search input:focus {
          width: 100%;
        }

        main {
          padding: 18px 18px 60px 18px;
        }

        .block {
          padding: 18px 16px;
        }

        .team-head {
          padding: 18px;
          gap: 16px;
        }

        .team-head .count {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <a class="brand" href="index.html"><img src="assets/logo-neoteem.jpg" alt="Neoteem" /></a>
      <h1>Organigramme</h1>
      <span class="spacer"></span>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-4.3-4.3" />
        </svg>
        <input id="search" type="search" placeholder="Rechercher un nom, un role" autocomplete="off" />
      </label>
      <a class="admin-link" href="admin.html">Administration</a>
    </header>

    <nav class="tabs" id="tabs"></nav>

    <main id="content">
      <div class="state"><h2>Chargement de l'organigramme</h2></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="assets/supabase-config.js"></script>
    <script src="assets/orga-store.js"></script>
    <script>
      // Les donnees viennent integralement de Supabase (voir db/schema.sql).
      // Toute modification se fait depuis admin.html.
      const tabsEl = document.getElementById("tabs");
      const contentEl = document.getElementById("content");
      const searchEl = document.getElementById("search");

      let teams = [];

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char],
        );
      }

      function countPeople(team) {
        return team.groups.reduce(
          (total, group) => total + group.sub_groups.reduce((sum, sub) => sum + sub.assignments.length, 0),
          0,
        );
      }

      function personCard(assignment) {
        const person = assignment.person || {};
        const classes = ["person"];
        if (assignment.is_founder) classes.push("is-founder");
        else if (assignment.is_manager) classes.push("is-manager");
        const haystack = `${person.full_name || ""} ${assignment.role || ""}`.toLowerCase();

        return `
          <article class="${classes.join(" ")}" data-search="${escapeHtml(haystack)}">
            <img
              src="${window.Orga.photoUrl(person.photo_path)}"
              alt="${escapeHtml(person.full_name)}"
              loading="lazy"
              onerror="this.src = window.Orga.AVATAR_PLACEHOLDER"
            />
            <span class="name">${escapeHtml(person.full_name)}</span>
            <span class="role">${escapeHtml(assignment.role)}</span>
          </article>
        `;
      }

      function cardsGrid(assignments) {
        const centered = assignments.some(assignment => assignment.is_founder);
        return `
          <div class="cards${centered ? " centered" : ""}">
            ${assignments.map(personCard).join("")}
          </div>
        `;
      }

      function showTeam(index) {
        tabsEl.querySelectorAll("button").forEach((btn, i) => btn.classList.toggle("active", i === index));

        const team = teams[index];
        if (!team) return;
        const total = countPeople(team);

        let html = `
          <section class="team-head">
            <img
              class="portrait"
              src="${window.Orga.photoUrl(team.leader_photo_path)}"
              alt="${escapeHtml(team.leader_name)}"
              onerror="this.src = window.Orga.AVATAR_PLACEHOLDER"
            />
            <div>
              <p class="eyebrow">${escapeHtml(team.label)}</p>
              <h2>${escapeHtml(team.leader_name)}</h2>
              <p class="role">${escapeHtml(team.leader_role)}</p>
            </div>
            <p class="count"><strong>${total}</strong>${total > 1 ? "collaborateurs" : "collaborateur"}</p>
          </section>
        `;

        team.groups.forEach(group => {
          const groupTotal = group.sub_groups.reduce((sum, sub) => sum + sub.assignments.length, 0);
          html += '<section class="block">';
          // Un bloc sans titre (la direction, par exemple) se passe d'en-tete
          if (group.title) {
            html += `
              <div class="block-head">
                <h3>${escapeHtml(group.title)}</h3>
                <span class="tally">${groupTotal}</span>
              </div>
            `;
          }

          if (window.Orga.isFlatGroup(group)) {
            html += cardsGrid(group.sub_groups[0].assignments);
          } else {
            group.sub_groups.forEach(subGroup => {
              html += '<div class="subline">';
              if (subGroup.label) {
                html += `
                  <h4 class="subline-label">
                    ${escapeHtml(subGroup.label)}
                    <span class="tally">${subGroup.assignments.length}</span>
                  </h4>
                `;
              }
              html += cardsGrid(subGroup.assignments);
              html += "</div>";
            });
          }

          html += "</section>";
        });

        contentEl.innerHTML = html;
        applySearch();
      }

      // Filtre les cartes de l'onglet courant, puis masque les sections vides
      function applySearch() {
        const query = searchEl.value.trim().toLowerCase();
        let visible = 0;
        contentEl.classList.toggle("filtering", query.length > 0);

        contentEl.querySelectorAll(".person").forEach(card => {
          const match = !query || card.dataset.search.includes(query);
          card.classList.toggle("hidden", !match);
          if (match) visible++;
        });

        contentEl.querySelectorAll(".subline").forEach(subline => {
          subline.classList.toggle("hidden", !subline.querySelector(".person:not(.hidden)"));
        });

        contentEl.querySelectorAll(".block").forEach(block => {
          block.classList.toggle("hidden", !block.querySelector(".person:not(.hidden)"));
        });

        const previous = contentEl.querySelector(".state.no-result");
        if (previous) previous.remove();
        if (query && visible === 0) {
          contentEl.insertAdjacentHTML(
            "beforeend",
            `<div class="state no-result">
               <h2>Aucun resultat pour "${escapeHtml(searchEl.value.trim())}"</h2>
               <p>La recherche porte sur l'onglet affiche.</p>
             </div>`,
          );
        }
      }

      function showState(title, detail, isError) {
        tabsEl.innerHTML = "";
        contentEl.innerHTML = `
          <div class="state${isError ? " error" : ""}">
            <h2>${escapeHtml(title)}</h2>
            ${detail ? `<p>${escapeHtml(detail)}</p>` : ""}
          </div>
        `;
      }

      async function init() {
        try {
          teams = await window.Orga.loadTree();
        } catch (error) {
          showState("Impossible de charger l'organigramme", error.message, true);
          return;
        }

        if (!teams.length) {
          showState("Aucune equipe enregistree", "Ajoutez un onglet depuis la page Administration.", false);
          return;
        }

        tabsEl.innerHTML = "";
        teams.forEach((team, index) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = team.label;
          btn.onclick = () => showTeam(index);
          tabsEl.appendChild(btn);
        });

        searchEl.addEventListener("input", applySearch);
        showTeam(0);
      }

      init();
    </script>
  </body>
</html>
