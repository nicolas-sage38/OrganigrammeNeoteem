<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Organigramme Neoteem</title>
    <link rel="icon" href="assets/favicon.jpg" />
    <style>
      :root {
        /* Marque */
        --navy-deep: #01203f;
        --navy: #013677;
        --teal-deep: #016b7a;
        --teal: #00a998;
        --gradient: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%);

        /* Neutres */
        --ink: #0d1a2b;
        --ink-2: #53606f;
        --ink-3: #8a94a2;
        --line: #e6e9ee;
        --line-2: #d3d9e2;
        --surface: #ffffff;
        --canvas: #f4f6f9;
        --tint: #eef3f9;

        --radius-lg: 18px;
        --radius: 14px;
        --radius-sm: 10px;

        --shadow-card: 0 1px 2px rgba(1, 32, 63, 0.04), 0 8px 24px rgba(1, 32, 63, 0.04);
        --shadow-hover: 0 12px 28px rgba(1, 32, 63, 0.12);
        --shadow-hero: 0 18px 40px rgba(1, 32, 63, 0.28);

        --topbar-h: 56px;

        --font:
          "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font);
        font-size: 15px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      /* ---------------------------------------------------------------
         Barre superieure
      --------------------------------------------------------------- */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: var(--topbar-h);
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 28px;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: saturate(180%) blur(12px);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
      }

      .brand img {
        height: 26px;
        width: auto;
        display: block;
      }

      .topbar h1 {
        font-size: 0.92rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        padding-left: 18px;
        border-left: 1px solid var(--line);
      }

      .topbar .spacer {
        flex: 1;
      }

      .search {
        position: relative;
        display: flex;
        align-items: center;
      }

      .search input {
        font-family: inherit;
        font-size: 0.84rem;
        color: var(--ink);
        background: var(--canvas);
        border: 1px solid var(--line);
        border-radius: 50px;
        padding: 8px 16px 8px 36px;
        width: 250px;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease,
          width 0.15s ease;
      }

      .search input::placeholder {
        color: var(--ink-3);
      }

      .search input:focus {
        outline: none;
        background: var(--surface);
        border-color: var(--navy);
        box-shadow: 0 0 0 3px var(--tint);
        width: 290px;
      }

      .search svg {
        position: absolute;
        left: 13px;
        width: 14px;
        height: 14px;
        stroke: var(--ink-3);
        fill: none;
        stroke-width: 2;
        pointer-events: none;
      }

      .admin-link {
        font-size: 0.79rem;
        font-weight: 500;
        color: var(--ink-3);
        text-decoration: none;
        transition: color 0.15s ease;
      }

      .admin-link:hover {
        color: var(--navy);
      }

      /* ---------------------------------------------------------------
         Bandeau de l'equipe
      --------------------------------------------------------------- */
      .hero {
        position: relative;
        overflow: hidden;
        padding: 42px 28px 46px 28px;
        color: white;
        background: linear-gradient(
          112deg,
          var(--navy-deep) 0%,
          var(--navy) 36%,
          var(--teal-deep) 72%,
          var(--teal) 100%
        );
      }

      /* Halo pour donner du volume au degrade */
      .hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(115% 150% at 86% -10%, rgba(255, 255, 255, 0.22), transparent 55%);
        pointer-events: none;
      }

      .hero-inner {
        position: relative;
        z-index: 1;
        max-width: 1360px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 26px;
        flex-wrap: wrap;
      }

      .hero-avatar {
        display: block;
        flex: none;
        width: 104px;
        height: 104px;
        border-radius: 50%;
        padding: 3px;
        background: rgba(255, 255, 255, 0.34);
        box-shadow: var(--shadow-hero);
      }

      .hero-avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        background: var(--tint);
        border: 2px solid rgba(255, 255, 255, 0.92);
      }

      .hero .eyebrow {
        font-size: 0.68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: rgba(255, 255, 255, 0.72);
      }

      .hero h2 {
        font-size: clamp(1.55rem, 3vw, 2.1rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 6px 0 2px 0;
      }

      .hero .role {
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.82);
      }

      .hero-stats {
        margin-left: auto;
        display: flex;
        gap: 38px;
      }

      .hero-stats strong {
        display: block;
        font-size: 1.85rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }

      .hero-stats span {
        font-size: 0.66rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.11em;
        color: rgba(255, 255, 255, 0.66);
      }

      /* ---------------------------------------------------------------
         Onglets
      --------------------------------------------------------------- */
      .tabs {
        position: sticky;
        top: var(--topbar-h);
        z-index: 20;
        display: flex;
        gap: 2px;
        padding: 0 28px;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: saturate(180%) blur(12px);
        border-bottom: 1px solid var(--line);
        overflow-x: auto;
        scrollbar-width: none;
      }

      .tabs::-webkit-scrollbar {
        display: none;
      }

      .tabs button {
        position: relative;
        border: none;
        background: none;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--ink-2);
        padding: 15px 16px 14px 16px;
        cursor: pointer;
        white-space: nowrap;
        transition: color 0.15s ease;
      }

      .tabs button::after {
        content: "";
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 0;
        height: 2px;
        border-radius: 2px 2px 0 0;
        background: var(--gradient);
        opacity: 0;
        transition: opacity 0.18s ease;
      }

      .tabs button:hover {
        color: var(--ink);
      }

      .tabs button.active {
        color: var(--navy);
        font-weight: 600;
      }

      .tabs button.active::after {
        opacity: 1;
      }

      /* ---------------------------------------------------------------
         Contenu
      --------------------------------------------------------------- */
      main {
        max-width: 1360px;
        margin: 0 auto;
        padding: 26px 28px 80px 28px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .block {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        padding: 22px 26px 26px 26px;
      }

      .block-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 4px;
      }

      .block-head h3 {
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ink);
      }

      /* Filet qui se dissipe apres le titre */
      .block-head::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--line-2), transparent);
      }

      .chip {
        font-size: 0.69rem;
        font-weight: 700;
        color: var(--navy);
        background: var(--tint);
        border-radius: 50px;
        padding: 3px 10px;
        font-variant-numeric: tabular-nums;
        flex: none;
      }

      /* Sous-ligne */
      .subline {
        padding-top: 18px;
      }

      .subline + .subline {
        border-top: 1px solid var(--line);
        margin-top: 6px;
      }

      .subline-label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.71rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--ink-2);
        margin-bottom: 4px;
      }

      .subline-label::before {
        content: "";
        flex: none;
        width: 18px;
        height: 2px;
        border-radius: 2px;
        background: var(--gradient);
      }

      /* ---------------------------------------------------------------
         Cartes
      --------------------------------------------------------------- */
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
        gap: 12px;
        padding-top: 16px;
      }

      .cards.featured {
        grid-template-columns: repeat(auto-fit, minmax(230px, 274px));
        justify-content: center;
        gap: 18px;
        padding-top: 8px;
      }

      .person {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 3px;
        padding: 18px 12px 16px 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          border-color 0.18s ease;
      }

      .person:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-hover);
        border-color: var(--line-2);
      }

      .avatar {
        display: block;
        flex: none;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        padding: 1px;
        margin-bottom: 12px;
        background: var(--line-2);
      }

      .avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        background: var(--tint);
      }

      .person .name {
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.005em;
      }

      .person .role {
        font-size: 0.74rem;
        color: var(--ink-3);
        line-height: 1.35;
      }

      /* Responsable : anneau degrade */
      .person.is-manager .avatar {
        padding: 2.5px;
        background: var(--gradient);
      }

      .person.is-manager .avatar img {
        border: 2px solid var(--surface);
      }

      .person.is-manager .role {
        color: var(--navy);
        font-weight: 600;
      }

      /* Direction : carte mise en avant */
      .person.is-founder {
        padding: 30px 22px 26px 22px;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      }

      .person.is-founder .avatar {
        width: 132px;
        height: 132px;
        padding: 3px;
        margin-bottom: 18px;
        background: var(--gradient);
      }

      .person.is-founder .avatar img {
        border: 3px solid var(--surface);
      }

      .person.is-founder .name {
        font-size: 1.05rem;
      }

      .person.is-founder .role {
        font-size: 0.82rem;
        color: var(--ink-2);
      }

      /* ---------------------------------------------------------------
         Etats
      --------------------------------------------------------------- */
      .state {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
        padding: 44px 30px;
        text-align: center;
      }

      .state h2 {
        font-size: 0.98rem;
        font-weight: 600;
      }

      .state p {
        margin-top: 6px;
        font-size: 0.85rem;
        color: var(--ink-3);
      }

      .state.error {
        border-left: 3px solid #c0392b;
        text-align: left;
      }

      .state.error h2 {
        color: #c0392b;
      }

      .hidden {
        display: none !important;
      }

      /* Pendant une recherche, les compteurs de section ne veulent plus rien dire */
      main.filtering .chip {
        display: none;
      }

      @media (max-width: 760px) {
        .topbar {
          height: auto;
          padding: 12px 18px;
          flex-wrap: wrap;
          gap: 12px;
          position: static;
        }

        .topbar h1 {
          padding-left: 0;
          border-left: none;
        }

        .topbar .spacer {
          display: none;
        }

        .admin-link {
          order: 2;
          margin-left: auto;
        }

        .search {
          order: 3;
          flex: 1 0 100%;
        }

        .search input,
        .search input:focus {
          width: 100%;
        }

        .hero {
          padding: 30px 18px 32px 18px;
        }

        .hero-inner {
          gap: 18px;
        }

        .hero-avatar {
          width: 76px;
          height: 76px;
        }

        .hero-stats {
          margin-left: 0;
          gap: 26px;
          padding-top: 4px;
        }

        .hero-stats strong {
          font-size: 1.4rem;
        }

        .tabs {
          position: static;
          padding: 0 18px;
        }

        main {
          padding: 18px 18px 60px 18px;
        }

        .block {
          padding: 18px 16px 20px 16px;
        }

        .cards {
          grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
          gap: 8px;
        }
      }
    </style>
  </head>

  <body>
    <header class="topbar">
      <a class="brand" href="index.html"><img src="assets/logo-neoteem.jpg" alt="Neoteem" /></a>
      <h1>Organigramme</h1>
      <span class="spacer"></span>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-4.3-4.3" />
        </svg>
        <input id="search" type="search" placeholder="Rechercher un nom, un role" autocomplete="off" />
      </label>
      <a class="admin-link" href="admin.html">Administration</a>
    </header>

    <div id="hero"></div>
    <nav class="tabs" id="tabs"></nav>

    <main id="content">
      <div class="state"><h2>Chargement de l'organigramme</h2></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="assets/supabase-config.js"></script>
    <script src="assets/orga-store.js"></script>
    <script>
      // Les donnees viennent integralement de Supabase (voir db/schema.sql).
      // Toute modification se fait depuis admin.html.
      const heroEl = document.getElementById("hero");
      const tabsEl = document.getElementById("tabs");
      const contentEl = document.getElementById("content");
      const searchEl = document.getElementById("search");

      let teams = [];

      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char],
        );
      }

      function teamCounts(team) {
        let people = 0;
        let managers = 0;
        team.groups.forEach(group =>
          group.sub_groups.forEach(sub =>
            sub.assignments.forEach(assignment => {
              people++;
              if (assignment.is_manager) managers++;
            }),
          ),
        );
        return { people, sections: team.groups.length, managers };
      }

      function plural(count, word) {
        return count > 1 ? word + "s" : word;
      }

      function personCard(assignment) {
        const person = assignment.person || {};
        const classes = ["person"];
        if (assignment.is_founder) classes.push("is-founder");
        else if (assignment.is_manager) classes.push("is-manager");
        const haystack = `${person.full_name || ""} ${assignment.role || ""}`.toLowerCase();

        return `
          <article class="${classes.join(" ")}" data-search="${escapeHtml(haystack)}">
            <span class="avatar">
              <img
                src="${window.Orga.photoUrl(person.photo_path)}"
                alt="${escapeHtml(person.full_name)}"
                loading="lazy"
                onerror="this.src = window.Orga.AVATAR_PLACEHOLDER"
              />
            </span>
            <span class="name">${escapeHtml(person.full_name)}</span>
            <span class="role">${escapeHtml(assignment.role)}</span>
          </article>
        `;
      }

      function cardsGrid(assignments) {
        const featured = assignments.some(assignment => assignment.is_founder);
        return `
          <div class="cards${featured ? " featured" : ""}">
            ${assignments.map(personCard).join("")}
          </div>
        `;
      }

      function showTeam(index) {
        tabsEl.querySelectorAll("button").forEach((btn, i) => btn.classList.toggle("active", i === index));

        const team = teams[index];
        if (!team) return;
        const counts = teamCounts(team);

        heroEl.innerHTML = `
          <section class="hero">
            <div class="hero-inner">
              <span class="hero-avatar">
                <img
                  src="${window.Orga.photoUrl(team.leader_photo_path)}"
                  alt="${escapeHtml(team.leader_name)}"
                  onerror="this.src = window.Orga.AVATAR_PLACEHOLDER"
                />
              </span>
              <div>
                <p class="eyebrow">${escapeHtml(team.label)}</p>
                <h2>${escapeHtml(team.leader_name)}</h2>
                <p class="role">${escapeHtml(team.leader_role)}</p>
              </div>
              <div class="hero-stats">
                <div>
                  <strong>${counts.people}</strong>
                  <span>${plural(counts.people, "collaborateur")}</span>
                </div>
                <div>
                  <strong>${counts.sections}</strong>
                  <span>${plural(counts.sections, "section")}</span>
                </div>
                ${
                  counts.managers
                    ? `<div>
                         <strong>${counts.managers}</strong>
                         <span>${plural(counts.managers, "responsable")}</span>
                       </div>`
                    : ""
                }
              </div>
            </div>
          </section>
        `;

        let html = "";
        team.groups.forEach(group => {
          const total = group.sub_groups.reduce((sum, sub) => sum + sub.assignments.length, 0);
          html += '<section class="block">';
          // Un bloc sans titre (la direction, par exemple) se passe d'en-tete
          if (group.title) {
            html += `
              <div class="block-head">
                <h3>${escapeHtml(group.title)}</h3>
                <span class="chip">${total}</span>
              </div>
            `;
          }

          if (window.Orga.isFlatGroup(group)) {
            html += cardsGrid(group.sub_groups[0].assignments);
          } else {
            group.sub_groups.forEach(subGroup => {
              html += '<div class="subline">';
              if (subGroup.label) {
                html += `
                  <h4 class="subline-label">
                    ${escapeHtml(subGroup.label)}
                    <span class="chip">${subGroup.assignments.length}</span>
                  </h4>
                `;
              }
              html += cardsGrid(subGroup.assignments);
              html += "</div>";
            });
          }

          html += "</section>";
        });

        contentEl.innerHTML = html;
        applySearch();
      }

      // Filtre les cartes de l'onglet courant, puis masque les sections vides
      function applySearch() {
        const query = searchEl.value.trim().toLowerCase();
        let visible = 0;
        contentEl.classList.toggle("filtering", query.length > 0);

        contentEl.querySelectorAll(".person").forEach(card => {
          const match = !query || card.dataset.search.includes(query);
          card.classList.toggle("hidden", !match);
          if (match) visible++;
        });

        contentEl.querySelectorAll(".subline").forEach(subline => {
          subline.classList.toggle("hidden", !subline.querySelector(".person:not(.hidden)"));
        });

        contentEl.querySelectorAll(".block").forEach(block => {
          block.classList.toggle("hidden", !block.querySelector(".person:not(.hidden)"));
        });

        const previous = contentEl.querySelector(".state.no-result");
        if (previous) previous.remove();
        if (query && visible === 0) {
          contentEl.insertAdjacentHTML(
            "beforeend",
            `<div class="state no-result">
               <h2>Aucun resultat pour "${escapeHtml(searchEl.value.trim())}"</h2>
               <p>La recherche porte sur l'onglet affiche.</p>
             </div>`,
          );
        }
      }

      function showState(title, detail, isError) {
        heroEl.innerHTML = "";
        tabsEl.innerHTML = "";
        contentEl.innerHTML = `
          <div class="state${isError ? " error" : ""}">
            <h2>${escapeHtml(title)}</h2>
            ${detail ? `<p>${escapeHtml(detail)}</p>` : ""}
          </div>
        `;
      }

      async function init() {
        try {
          teams = await window.Orga.loadTree();
        } catch (error) {
          showState("Impossible de charger l'organigramme", error.message, true);
          return;
        }

        if (!teams.length) {
          showState("Aucune equipe enregistree", "Ajoutez un onglet depuis la page Administration.", false);
          return;
        }

        tabsEl.innerHTML = "";
        teams.forEach((team, index) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = team.label;
          btn.onclick = () => showTeam(index);
          tabsEl.appendChild(btn);
        });

        searchEl.addEventListener("input", applySearch);
        showTeam(0);
      }

      init();
    </script>
  </body>
</html>
